services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/kinoxp
      SPRING_DATASOURCE_USERNAME: kinoxp
      SPRING_DATASOURCE_PASSWORD: kinoxp2024
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: kinoxp
      MYSQL_USER: kinoxp
      MYSQL_PASSWORD: kinoxp2024
      MYSQL_ROOT_PASSWORD: root2024
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5